<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#F0F3F1; --surface:#FFFFFF; --surface-2:#E7ECE9; --surface-3:#DDE4E0;
  --ink:#0F1614; --ink-2:#3A4844; --muted:#63736D;
  --line:#D7DEDA; --line-2:#C3CCC7;
  --accent:#0D5C43; --accent-soft:#DDEAE4; --accent-ink:#FFFFFF;
  --gold:#8A6B1F; --gold-soft:#F0E7CF;
  --crit:#A93226; --crit-soft:#F5DFDC;
  --warn:#96681A; --warn-soft:#F6E9D2;
  --ok:#17795A; --ok-soft:#DBEDE5;
  --shadow:0 1px 2px rgba(15,22,20,.05), 0 8px 24px -12px rgba(15,22,20,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0B100E; --surface:#121917; --surface-2:#1A2320; --surface-3:#222D28;
  --ink:#E6EDE9; --ink-2:#B9C6C1; --muted:#8A9A94;
  --line:#243029; --line-2:#33413A;
  --accent:#4CB18C; --accent-soft:#122A22; --accent-ink:#08110D;
  --gold:#C9A75A; --gold-soft:#2A2314;
  --crit:#E0776A; --crit-soft:#2E1815;
  --warn:#D6A24E; --warn-soft:#2B2113;
  --ok:#4CB18C; --ok-soft:#12281F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0B100E; --surface:#121917; --surface-2:#1A2320; --surface-3:#222D28;
  --ink:#E6EDE9; --ink-2:#B9C6C1; --muted:#8A9A94;
  --line:#243029; --line-2:#33413A;
  --accent:#4CB18C; --accent-soft:#122A22; --accent-ink:#08110D;
  --gold:#C9A75A; --gold-soft:#2A2314;
  --crit:#E0776A; --crit-soft:#2E1815;
  --warn:#D6A24E; --warn-soft:#2B2113;
  --ok:#4CB18C; --ok-soft:#12281F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.22rem}h3{font-size:1.02rem}
p{margin:0}
button{font-family:inherit;cursor:pointer}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.xs{font-size:.78rem}.sm{font-size:.86rem}
.neg{color:var(--crit)}.pos{color:var(--ok)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand b{font-family:"Newsreader",Georgia,serif;font-size:1.14rem;font-weight:600}
.brand b span{color:var(--accent)}
.brand em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;padding:10px 8px;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border:none;background:none;border-radius:4px;color:var(--ink-2);
  font-size:.9rem;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:.68rem;font-weight:700;
  background:var(--surface-2);color:var(--muted);padding:1px 6px;border-radius:8px}
.nav button[aria-current="page"] .cnt{background:var(--accent);color:var(--accent-ink)}
.nav .cnt.hot{background:var(--crit);color:#fff}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);
  font-size:.7rem;color:var(--muted);line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar .sub{font-size:.82rem;color:var(--muted)}
.page{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px}

/* ---------- controls ---------- */
.btn{font-family:"JetBrains Mono",monospace;font-size:.7rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:7px 12px;border-radius:4px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:.64rem}
select,input[type="search"],input[type="text"]{font-family:inherit;font-size:.86rem;
  padding:6px 10px;border:1px solid var(--line-2);border-radius:4px;
  background:var(--surface);color:var(--ink)}
input[type="search"]{min-width:190px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:"JetBrains Mono",monospace;font-size:.66rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--line-2);
  background:transparent;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:"JetBrains Mono",monospace;
  font-size:.63rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--surface-2);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:1.32rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:.7rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
  font-family:"JetBrains Mono",monospace;font-weight:700}
.kpi.bad b{color:var(--crit)}.kpi.good b{color:var(--ok)}.kpi.gold b{color:var(--gold)}

/* ---------- card / table ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.card-h h2,.card-h h3{margin-right:auto}
.card-b{padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{font-family:"JetBrains Mono",monospace;font-size:.62rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--ink)}
td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:.8rem}
td.l{font-family:"Public Sans",sans-serif;font-size:.87rem}
td.nm{font-weight:600}
tbody tr:hover{background:var(--surface-2)}
tbody tr.clk{cursor:pointer}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.flagw td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.dim{opacity:.5}
tfoot td{font-weight:700;border-top:2px solid var(--line-2);border-bottom:none;background:var(--surface-2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:.9rem}

/* ---------- inbox ---------- */
.inbox{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.irow .t{font-size:.88rem;line-height:1.4}
.irow .t b{font-weight:600}
.irow .t small{display:block;color:var(--muted);font-size:.76rem;margin-top:1px}
.irow .a{display:flex;gap:6px}
.irow.done{opacity:.4}
@media(max-width:720px){.irow{grid-template-columns:1fr;gap:7px}}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:"JetBrains Mono",monospace;font-size:9px;fill:var(--muted)}
.chart .zl{stroke:var(--line-2);stroke-width:1}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,17,13,.45);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);z-index:61;
  background:var(--surface);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.drawer-b{padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline;font-size:.85rem}
.kv dt{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kv dd{margin:0;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.kv dd.txt{font-family:"Public Sans",sans-serif}
.sec-t{font-family:"JetBrains Mono",monospace;font-size:.65rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.xbtn{border:1px solid var(--line-2);background:transparent;color:var(--muted);
  border-radius:4px;width:28px;height:28px;font-size:15px;line-height:1;margin-left:auto}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:5px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:all .2s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- note ---------- */
.note{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:5px;
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  font-size:.85rem;line-height:1.45}
.note.acc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.note b{font-weight:600}

@media(max-width:840px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;
    border-right:none;border-bottom:1px solid var(--line)}
  .brand{border-bottom:none;border-right:1px solid var(--line);white-space:nowrap}
  .nav{flex-direction:row;padding:8px}
  .nav button{white-space:nowrap}
  .side-foot{display:none}
  .page,.topbar{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = (s,r)=> (r||document).querySelector(s);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- format ---------- */
const money = (v,d)=> v==null||isNaN(v) ? '—' :
  (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('ru-RU',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d});
const n0 = v => v==null||isNaN(v) ? '—' : Math.round(v).toLocaleString('ru-RU');
const pct = v => v==null ? '—' : (v*100).toFixed(v*100%1?1:0)+'%';
const dfmt = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4) : '—';
const TODAY = '2026-08-27';
const daysBetween = (a,b)=> Math.round((Date.parse(b)-Date.parse(a))/864e5);

/* ---------- indexes ---------- */
const CM = {}; D.creators.forEach(c=>CM[c.name]=c);
const byCr = {}; D.daily.forEach(r=>{ (byCr[r.c]=byCr[r.c]||[]).push(r); });
Object.values(byCr).forEach(a=>a.sort((x,y)=>x.d<y.d?-1:1));
const ALL_DATES = [...new Set(D.daily.map(r=>r.d))].sort();
const DMIN = ALL_DATES[0], DMAX = ALL_DATES[ALL_DATES.length-1];

const fridays = (()=>{ const out=[]; let d=new Date(DMIN+'T00:00:00Z');
  while(d.getUTCDay()!==5) d.setUTCDate(d.getUTCDate()+1);
  while(d.toISOString().slice(0,10)<=DMAX){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+7); }
  return out; })();

function shift(iso,days){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); }
function statWin(name,a,b){ let w=0,g=0,f=0,n=0;
  (byCr[name]||[]).forEach(r=>{ if(r.d>=a&&r.d<=b){ w+=r.w; g+=r.g; f+=r.f; n++; } });
  return {w,g,f,n}; }

/* real cost & ftd per creator */
const COST={}, FTD={}, WAG={}, GGR={};
D.tx.forEach(t=>{ if(t.name&&t.real) COST[t.name]=(COST[t.name]||0)+t.real; });
D.creators.forEach(c=>{ const s=statWin(c.name,DMIN,DMAX); WAG[c.name]=s.w; GGR[c.name]=s.g; FTD[c.name]=s.f; });

/* ---------- NNCO engine ---------- */
function calcBase(base, s){ return base==='Wager x HE' ? s.w*D.const.heSlots : s.g; }
function periodRows(endISO, days, base){
  const start = shift(endISO, -(days-1));
  const month = endISO.slice(0,7);
  // все недельные пятницы месяца, закрывшиеся ДО начала выбранного окна
  const prior = fridays.filter(f=>f.slice(0,7)===month && f < start);
  return D.creators
    .filter(c=>(c.status==='Active'||c.status==='Trial') && c.rsBase===base)
    .map(c=>{
      let wm=0, mtd=0;
      prior.forEach(pe=>{
        mtd += calcBase(base, statWin(c.name, shift(pe,-6), pe));
        if (mtd > wm) wm = mtd;
      });
      const s = statWin(c.name, start, endISO);
      const b = calcBase(base, s);
      mtd += b;
      const delta = mtd - wm;
      const payable = Math.max(0, delta), carry = Math.min(0, delta);
      const due = payable * (c.rs||0);
      const flags=[];
      if(c.status==='Paused') flags.push({k:'crit',t:'Статус Paused'});
      if(!c.rs) flags.push({k:'warn',t:'Нет ставки RS'});
      if(carry<0) flags.push({k:'info',t:'Гасит минус'});
      if(s.n===0 && b===0) flags.push({k:'info',t:'Нет оборота'});
      return {c, s, base:b, mtd, payable, carry, due, flags};
    })
    .sort((a,b)=>b.due-a.due);
}

/* ---------- alerts ---------- */
function buildAlerts(){
  const A=[];
  D.tx.forEach((t,i)=>{ if(t.amount && !t.filled && t.name){
    A.push({p:'crit',type:'Выплата',title:`${t.name} — ${money(t.amount)} не закрыто`,
      sub:`${t.sec} · проводка от ${dfmt(t.date)} · нет отметки об оплате`,
      act:['Отметить оплату'],id:'tx'+i}); }});
  D.creators.forEach(c=>{ if((c.status==='Active'||c.status==='Trial') && c.rebook){
    const dl = daysBetween(TODAY,c.rebook);
    if(dl<0) A.push({p:'crit',type:'Ребук',title:`${c.name} — сделка просрочена на ${-dl} дн.`,
      sub:`Ребук был ${dfmt(c.rebook)}, статус всё ещё ${c.status}`,act:['Продлить','Закрыть'],id:'rb'+c.name});
    else if(dl<=7) A.push({p:'warn',type:'Ребук',title:`${c.name} — сделка истекает через ${dl} дн.`,
      sub:`${c.deal||'—'} · ${dfmt(c.start)} → ${dfmt(c.rebook)}`,act:['Продлить'],id:'rb'+c.name});
  }});
  [...D.he,...D.ggr].forEach((p,i)=>{ if(p.overlap && String(p.overlap).indexOf('OVER')>=0){
    A.push({p:'crit',type:'Пересечение',title:`${p.name} — периоды пересекаются`,
      sub:`${dfmt(p.start)} → ${dfmt(p.end)} перекрывает соседнюю строку. Часть дней посчитана дважды`,
      act:['Развести периоды'],id:'ov'+i}); }});
  D.ggr.forEach((p,i)=>{ if(p.base && p.base!=='GGR'){
    A.push({p:'crit',type:'Чужая база',title:`${p.name} — строка в GGR Payouts при базе «${p.base}»`,
      sub:`Расчёт не сработал, сумма ${money(p.due)} вписана вручную`,act:['Перенести'],id:'wb'+i}); }});
  [...D.he,...D.ggr].forEach((p,i)=>{
    const imp = p.gImport!=null?p.gImport:p.wImport, man = p.gManual!=null?p.gManual:p.wManual;
    if(man!=null && imp!=null && Math.abs(man-imp) > Math.max(1000, Math.abs(imp)*0.05)){
      A.push({p:'crit',type:'Расхождение',title:`${p.name} — ручная база расходится с импортом`,
        sub:`Введено ${n0(man)}, выгрузка за период даёт ${n0(imp)} · разница ${n0(Math.abs(man-imp))}`,
        act:['Сравнить','Запросить обоснование'],id:'mm'+i}); }});
  const unk = D.daily.filter(r=>r.c==='?');
  if(unk.length){ const w=unk.reduce((a,b)=>a+b.w,0), cabs=new Set(unk.map(r=>r.pid)).size;
    A.push({p:'crit',type:'Данные',title:`${unk.length} строк выгрузки без креатора`,
      sub:`${cabs} неопознанных кабинетов · ${n0(w)} оборота не учтено нигде`,act:['Привязать кабинеты'],id:'unk'}); }
  D.cabinets.forEach((c,i)=>{ if(c.status==='Mismatch'){
    A.push({p:'warn',type:'Кабинет',title:`${c.login} — рассинхрон привязки`,
      sub:`Выдан «${c.assigned||'—'}», привязан «${c.linked||'—'}»`,act:['Разобрать'],id:'cab'+i}); }});
  D.creators.forEach(c=>{ if((c.status==='Active'||c.status==='Trial') && !c.rsBase && (c.deal||'').indexOf('RS')>=0){
    A.push({p:'info',type:'Недочёт',title:`${c.name} — сделка RS без базы`,
      sub:`Deal Type «${c.deal}», но RS Base не задан — в период не попадёт`,act:['Заполнить'],id:'nb'+c.name}); }});
  D.creators.forEach(c=>{ if((c.status==='Active'||c.status==='Trial') && (COST[c.name]||0)>0 && !WAG[c.name] && !GGR[c.name]){
    A.push({p:'info',type:'Тишина',title:`${c.name} — затраты без трафика`,
      sub:`Потрачено ${money(COST[c.name])}, оборот за 52 дня — ноль`,act:['Профиль'],id:'sil'+c.name}); }});
  const ord={crit:0,warn:1,info:2};
  return A.sort((a,b)=>ord[a.p]-ord[b.p]);
}
const ALERTS = buildAlerts();
const DONE = new Set();

/* ---------- charts ---------- */
function barChart(data,{w=680,h=170,fmt=n0}={}){
  const pad={t:8,r:6,b:20,l:52}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=data.map(d=>d.v), mx=Math.max(0,...vals), mn=Math.min(0,...vals);
  const rng=(mx-mn)||1, y=v=>pad.t+ih-((v-mn)/rng)*ih, bw=Math.max(1.5,iw/data.length-1.5);
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Столбчатый график">`;
  [mx,(mx+mn)/2,mn].forEach(v=>{ s+=`<line class="gl" x1="${pad.l}" y1="${y(v).toFixed(1)}" x2="${w-pad.r}" y2="${y(v).toFixed(1)}"/>`
    +`<text x="${pad.l-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  s+=`<line class="zl" x1="${pad.l}" y1="${y(0).toFixed(1)}" x2="${w-pad.r}" y2="${y(0).toFixed(1)}"/>`;
  data.forEach((d,i)=>{ const x=pad.l+i*(iw/data.length), yy=y(Math.max(0,d.v)), hh=Math.abs(y(d.v)-y(0));
    s+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.8,hh).toFixed(1)}" `
      +`fill="${d.v<0?'var(--crit)':'var(--accent)'}" opacity="${d.dim?.35:.9}"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>`; });
  const step=Math.ceil(data.length/6);
  data.forEach((d,i)=>{ if(i%step===0) s+=`<text x="${(pad.l+i*(iw/data.length)+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(d.x||d.l)}</text>`; });
  return s+'</svg>';
}

  const pad={t:8,r:6,b:20,l:56}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=data.map(d=>d.v), mx=Math.max(0,...vals), mn=Math.min(0,...vals), rng=(mx-mn)||1;
  const x=i=>pad.l+(i/(data.length-1||1))*iw, y=v=>pad.t+ih-((v-mn)/rng)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Линейный график">`;
  [mx,(mx+mn)/2,mn].forEach(v=>{ s+=`<line class="gl" x1="${pad.l}" y1="${y(v).toFixed(1)}" x2="${w-pad.r}" y2="${y(v).toFixed(1)}"/>`
    +`<text x="${pad.l-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  s+=`<line class="zl" x1="${pad.l}" y1="${y(0).toFixed(1)}" x2="${w-pad.r}" y2="${y(0).toFixed(1)}"/>`;
  const pts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
  s+=`<polyline points="${pad.l},${y(0).toFixed(1)} ${pts} ${(w-pad.r).toFixed(1)},${y(0).toFixed(1)}" fill="var(--accent)" opacity=".12" stroke="none"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>`;
  const last=data[data.length-1];
  s+=`<circle cx="${x(data.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.2" fill="var(--accent)"/>`;
  const step=Math.ceil(data.length/6);
  data.forEach((d,i)=>{ if(i%step===0) s+=`<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(d.x||d.l)}</text>`; });
  return s+'</svg>';
}
function hbars(rows,{w=680,rh=21,fmt=money}={}){
  const h=rows.length*rh+10, lw=132, iw=w-lw-84;
  const mx=Math.max(...rows.map(r=>Math.abs(r.v)))||1, mid=lw+iw/2;
  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Горизонтальные бары">`;
  s+=`<line class="zl" x1="${mid}" y1="4" x2="${mid}" y2="${h-6}"/>`;
  rows.forEach((r,i)=>{ const y=6+i*rh, bw=Math.abs(r.v)/mx*(iw/2);
    const x=r.v<0?mid-bw:mid;
    s+=`<text x="${lw-8}" y="${y+11}" text-anchor="end" fill="var(--ink)" style="font-family:'Public Sans',sans-serif;font-size:10.5px">${esc(r.l)}</text>`;
    s+=`<rect x="${x.toFixed(1)}" y="${y+3}" width="${Math.max(1,bw).toFixed(1)}" height="${rh-9}" rx="1.5" fill="${r.v<0?'var(--crit)':'var(--accent)'}" opacity=".85"><title>${esc(r.l)}: ${fmt(r.v)}</title></rect>`;
    s+=`<text x="${w-6}" y="${y+11}" text-anchor="end" fill="var(--ink-2)">${fmt(r.v)}</text>`; });
  return s+'</svg>';
}

    Разрыв ${money(theo-totG)} — это дисперсия на нескольких крупных игроках, а не тренд. Именно поэтому недельный GGR нельзя использовать как метрику эффективности.</div></div>`));
  p.append(el(`<div class="grid2">
    <div class="card"><div class="card-h"><h3>GGR по дням</h3><span class="muted xs">один хайроллер решает месяц</span></div>
      <div class="card-b">${barChart(ggrDay)}</div></div>
    <div class="card"><div class="card-h"><h3>Накопительный GGR</h3><span class="muted xs">июль в плюс, август в минус</span></div>
      <div class="card-b">${lineChart(cum)}</div></div>
  </div>`));
  p.append(el(`<div class="grid2">
    <div class="card"><div class="card-h"><h3>Прибыль по креаторам</h3><span class="muted xs">GGR минус затраты</span></div>
      <div class="card-b">${hbars(pl)}</div></div>
    <div class="card"><div class="card-h"><h3>Затраты по типу операции</h3><span class="muted xs">куда ушли деньги</span></div>
      <div class="card-b">${hbars(opRows)}</div></div>
  </div>`));
  const top=D.creators.map(c=>({c,w:WAG[c.name]||0,g:GGR[c.name]||0,f:FTD[c.name]||0,cost:COST[c.name]||0}))
    .filter(r=>r.w||r.cost).sort((a,b)=>b.w-a.w);
  const card=el(`<div class="card"><div class="card-h"><h3>Экономика по креаторам</h3>
    <span class="muted xs">CPA считается только когда есть FTD</span></div>
    <div class="scroll"><table><thead><tr><th class="l">Креатор</th><th class="l">Статус</th><th>Оборот</th><th>GGR</th>
      <th>FTD</th><th>Затраты</th><th>CPA</th><th>Затраты / GGR</th><th>Итог</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=$('tbody',card);
  top.forEach(r=>{
    const ratio = r.g>0 ? r.cost/r.g : null;
    tb.append(el(`<tr class="clk">
      <td class="l nm">${esc(r.c.name)}</td>
      <td class="l"><span class="pill ${r.c.status==='Active'?'ok':r.c.status==='Trial'?'acc':'info'}">${esc(r.c.status||'—')}</span></td>
      <td>${n0(r.w)}</td><td class="${r.g<0?'neg':''}">${n0(r.g)}</td><td>${r.f||'—'}</td>
      <td>${r.cost?money(r.cost):'—'}</td>
      <td>${r.f?money(r.cost/r.f):'—'}</td>
      <td class="${ratio&&ratio>1?'neg':''}">${ratio!=null?ratio.toFixed(2):'—'}</td>
      <td class="${r.g-r.cost<0?'neg':'pos'}"><b>${money(r.g-r.cost)}</b></td></tr>`));
  });
  tb.querySelectorAll('tr').forEach((tr,i)=>tr.addEventListener('click',()=>openCreator(top[i].c.name)));
  p.append(card);
  return p;
};

/* ---------- drawer ---------- */
function openCreator(name){
  const c = CM[name]; if(!c) return;
  const rows = (byCr[name]||[]);
  const spark = rows.map(r=>({l:r.d,x:dfmt(r.d).slice(0,5),v:r.g}));
  const txs = D.tx.filter(t=>t.name===name);
  const cab = D.cabinets.find(x=>x.assigned===name);
  const acc = D.access.find(x=>x.name===name);
  const dl = c.rebook?daysBetween(TODAY,c.rebook):null;
  const d = $('#drawer');
  d.innerHTML = `
    <div class="drawer-h">
      <div><h2>${esc(c.name)}</h2>
        <div class="xs muted">${c.type==='Streamer'?'Стример':'Амбассадор'} · ${esc(c.content||'—')} · ${esc(c.deal||'—')}</div></div>
      <span class="pill ${c.status==='Active'?'ok':c.status==='Trial'?'acc':c.status==='Paused'?'warn':'info'}">${esc(c.status||'—')}</span>
      <button class="xbtn" id="xdr" aria-label="Закрыть">×</button>
    </div>
    <div class="drawer-b">
      <div class="kpis">
        <div class="kpi"><b>${n0(WAG[name])}</b><span>Оборот</span></div>
        <div class="kpi ${GGR[name]<0?'bad':''}"><b>${n0(GGR[name])}</b><span>GGR</span></div>
        <div class="kpi"><b>${FTD[name]||0}</b><span>FTD</span></div>
        <div class="kpi bad"><b>${money(COST[name]||0)}</b><span>Затраты</span></div>
      </div>
      ${spark.length?`<div><div class="sec-t">GGR по дням</div>${barChart(spark,{h:120})}</div>`:''}
      <div><div class="sec-t">Условия сделки</div>
        <dl class="kv">
          <dt>Фикс</dt><dd>${c.fix?money(c.fix):'—'} ${c.fixFreq?'· '+esc(c.fixFreq):''}</dd>
          <dt>RS</dt><dd>${c.rs?pct(c.rs):'—'} ${c.rsBase?'· '+esc(c.rsBase):''}</dd>
          ${c.gw?`<dt>GW / промо</dt><dd>${money(c.gw)}</dd>`:''}
          ${c.fill?`<dt>Фил на стрим</dt><dd>${money(c.fill)}</dd>`:''}
          ${c.streamsDeal?`<dt>Стримов в сделке</dt><dd>${c.streamsDeal} · проведено ${D.streams[name]||0}</dd>`:''}
          ${c.wdLimit?`<dt>Лимит вывода</dt><dd>${money(c.wdLimit)} ${c.wdPct?'· '+pct(c.wdPct):''}</dd>`:''}
          <dt>Начало</dt><dd>${dfmt(c.start)}</dd>
          <dt>Ребук</dt><dd>${c.rebook?dfmt(c.rebook)+(dl!=null?` <span class="${dl<0?'neg':''}">(${dl} дн.)</span>`:''):'—'}</dd>
          ${c.wallet?`<dt>Кошелёк</dt><dd class="xs">${esc(c.wallet)}</dd>`:''}
          ${c.comment?`<dt>Комментарий</dt><dd class="txt">${esc(c.comment)}</dd>`:''}
        </dl></div>
      <div><div class="sec-t">Кабинет и ссылка</div>
        <dl class="kv">
          <dt>PP email</dt><dd class="xs">${esc(acc&&acc.ppEmail||'—')}</dd>
          <dt>Реф-ссылка</dt><dd class="xs">${esc(acc&&acc.link||'—')}</dd>
          <dt>Ставка кабинета</dt><dd>${cab&&cab.rs!=null?pct(cab.rs):'—'} ${cab&&cab.base?'· '+esc(cab.base):''}
            ${cab&&cab.base&&c.rsBase&&cab.base!==c.rsBase?' <span class="pill crit">≠ базе сделки</span>':''}</dd>
          <dt>Пароль</dt><dd>${acc&&acc.hasPwd?'<span class="pill warn">в хранилище</span>':'—'}</dd>
        </dl></div>
      <div><div class="sec-t">Операции · ${txs.length}</div>
        <div class="card" style="box-shadow:none"><div class="scroll"><table>
        <thead><tr><th class="l">Дата</th><th class="l">Операция</th><th>Сумма</th><th class="l">Статус</th></tr></thead>
        <tbody>${txs.slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1).map(t=>`<tr>
          <td class="l">${dfmt(t.date)}</td><td class="l">${esc(t.op||'—')}</td>
          <td>${t.amount!=null?money(t.amount,2):'—'}</td>
          <td class="l">${t.filled?'<span class="pill ok">Оплачено</span>':'<span class="pill crit">Не закрыто</span>'}</td></tr>`).join('')
          ||'<tr><td colspan="4" class="empty">Операций нет</td></tr>'}</tbody></table></div></div></div>
    </div>`;
  d.setAttribute('aria-hidden','false'); d.classList.add('on'); $('#scrim').classList.add('on');
  $('#xdr',d).addEventListener('click',closeDrawer);
}
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

let TT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- router ---------- */
const NAV=[
  {k:'inbox',t:'Инбокс',cnt:()=>ALERTS.filter(a=>!DONE.has(a.id)).length,hot:true},
  {k:'payouts',t:'Выплаты'},
  {k:'roster',t:'Ростер',cnt:()=>D.creators.length},
  {k:'ledger',t:'Операции',cnt:()=>D.tx.length},
  {k:'cabinets',t:'Кабинеты',cnt:()=>D.cabinets.length},
  {k:'analytics',t:'Аналитика'},
];
const TITLES={inbox:['Инбокс','Что нужно сделать прямо сейчас'],
  payouts:['Выплаты','Сборка периода и расчёт RS'],
  roster:['Ростер','Креаторы, сделки и их результат'],
  ledger:['Операции','Все реальные затраты одной лентой'],
  cabinets:['Кабинеты','Атрибуция трафика и сверка ставок'],
  analytics:['Аналитика','Экономика канала за 52 дня']};
let CUR='inbox';
function render(){
  const nav=$('#nav'); nav.innerHTML='';
  NAV.forEach(i=>{
    const c = i.cnt?i.cnt():null;
    const b = el(`<button ${i.k===CUR?'aria-current="page"':''}>${esc(i.t)}
      ${c!=null?`<span class="cnt ${i.hot&&c?'hot':''}">${c}</span>`:''}</button>`);
    b.addEventListener('click',()=>{CUR=i.k;closeDrawer();render();window.scrollTo(0,0);});
    nav.append(b);
  });
  const [t,s]=TITLES[CUR];
  $('#topbar').innerHTML=`<h1>${esc(t)}</h1><span class="sub">${esc(s)}</span>`;
  const page=$('#page'); const built=PAGES[CUR]();
  page.replaceWith(built); built.id='page';
}
render();
})();
</script>
