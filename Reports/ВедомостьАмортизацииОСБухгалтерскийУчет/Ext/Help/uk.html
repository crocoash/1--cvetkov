<h1 class="">Звіт "Відомість амортизації ОЗ"</h1>
<p class="">У звіті "Відомість амортизації ОЗ" можна вивести дані про нараховану за період амортизації основних засобів. У звіті можна встановити швидкий відбір по основним засобам. </p>
<p class="">Дані про амортизацію виводяться за даними бухгалтерського обліку</p></body></html>
