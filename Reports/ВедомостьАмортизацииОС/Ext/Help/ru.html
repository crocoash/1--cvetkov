<h1 class="">Отчет "Ведомость амортизации ОС"</h1>
<p class="Usual">В отчете "Ведомость амортизации ОС" можно вывести данные о начисленной за период амортизации основных средств. В отчете можно установить быстрый отбор по основным средствам. </p>
<p class="Usual">Данные об амортизации выводятся по данным управленческого учета.</p></body></html>
