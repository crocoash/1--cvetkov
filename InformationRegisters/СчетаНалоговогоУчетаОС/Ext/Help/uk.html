<h1 class="">Регістр відомостей "Рахунки податкового обліку основних засобів"</h1>
<p class="Usual">Даний регістр призначений для збереження рахунку обліку вартості й суми накопиченої амортизації в організації об'єктів <a href="Catalog.ОсновныеСредства/Help">основних засобів</a> в податковому обліку</p>
<p class="Usual">Рахунки встановлюються документом <a href="Document.ВводВЭксплуатациюОС/Help">"Введення в експлуатацію ОЗ"</a>.</p></body></html>
