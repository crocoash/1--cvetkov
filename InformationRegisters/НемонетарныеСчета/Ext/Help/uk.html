<h1 class="">Регістр відомостей "Немонетарні рахунки"</h1>
<p class="Usual">У регістрі відомостей вказується список немонетарних валютних бухгалтерських рахунків. Залишки по таких рахунках при розрахунку курсових разниць не переоцінюються. До таких рахунків відносяться рахунки обліку виданих і отриманих авансів в іноземній валюті</p></body></html>
