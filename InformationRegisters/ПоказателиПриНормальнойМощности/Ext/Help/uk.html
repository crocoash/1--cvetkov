<h1 class="">Регістр відомостей "Показники при нормальній потужності"</h1>
<p class="Usual">Регістр відомостей призначений для зберігання параметрів розподілу постійних загальвиробничих витрат: бази розподілу й суми постійних витрат при нормальній потужності. Значення з регістра використовуються при розрахунку собівартості випуску</p></body></html>
