<h1 class="">Довідник «Об'єкти будівництва»</h1>
<p class="Usual">Довідник «Об'єкти будівництва» використовується в бухгалтерському й податковому обліку для ведення аналітичного обліку по споруджуваним (об'єктам що модернізуються, реконструюються, монтуються) об'єктах основних засобів</p></body></html>
