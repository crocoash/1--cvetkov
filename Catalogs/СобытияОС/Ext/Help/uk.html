<h1 class="">Довідник "Події основних засобів"</h1>
<p class="Usual">Довідник є класифікатором можливих подій, що відбуваються з ОЗ. Ця подія використовуються для бухгалтерського обліку. </p>
<p class="Usual">Інформація про події об'єкта основних засобів в бухгалтерському обліку організації відображається в регістрі відомостей <a href="../idn0">"Події ОЗ організації"</a>.</p></body></html>
