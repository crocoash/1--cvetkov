<h1 class="">Довідник "Субконто"</h1>
<p class="Usual">Довідник «Субконто» призначений для зберігання інформації про об'єкти аналітичного обліку, які не передбачені у всіх інших довідниках (інші об'єкти аналітичного обліку).</p>
<p class="Usual">Може використовуватися в бухгалтерському й податковому обліку</p></body></html>
